# Builds CW Station for Windows and Linux. A pushed version tag (v0.7.1 or 0.7.1) also publishes a
# GitHub release with both files attached; the program's update check (FR-CORE-10) looks for them.
# Lives in .github/workflows/build.yml. Failing tests show up as annotations on the run page
# (pytest-github-actions-annotate-failures in requirements-dev.txt).
name: build
on:
  push:
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag must match cwstation.__version__
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (python -c "import cwstation; print(cwstation.__version__)").Trim()
          $tag = "${{ github.ref_name }}".TrimStart("v", "V")
          if ($tag -ne $v) { throw "Tag $tag does not match cwstation.__version__ $v - installed copies would offer this update forever" }
      - name: Build (tests, PyInstaller, self-test, zip)
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: CWStation-win64
          path: dist/CWStation-*-win64.zip

  linux:
    # Built on the oldest supported Ubuntu: the result also runs on newer ones (22.04, 24.04, ...).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag must match cwstation.__version__
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(python -c "import cwstation; print(cwstation.__version__)")
          tag="${GITHUB_REF_NAME#[vV]}"
          [ "$tag" = "$v" ] || { echo "Tag $tag does not match cwstation.__version__ $v"; exit 1; }
      - name: System libraries (sound, Qt)
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libegl1 libgl1 libfontconfig1 libdbus-1-3
      - name: Build (tests, PyInstaller, self-test, tar.gz)
        run: bash packaging/build_linux.sh
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v7
        with:
          name: CWStation-linux-x64
          path: dist/CWStation-*-linux-*.tar.gz

  release:
    needs: [windows, linux]
    # publish when Windows built; a failed Linux build only leaves its file out
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: ${{ startsWith(github.ref_name, '0.') || startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
          generate_release_notes: true
