# Weekly check: has the DeepCW model (third_party/deepcw-engine) changed upstream?
# The pinned version is in third_party/deepcw-engine/UPSTREAM. When upstream has new commits this
# opens an issue "DeepCW upstream has changed" (or updates the open one) listing the commits and files.
# After updating the model, write the new commit and checksums into UPSTREAM and close the issue.
name: deepcw-upstream
on:
  schedule:
    - cron: "17 4 * * 1"  # Mondays 04:17 UTC
  workflow_dispatch:
permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Local copy matches UPSTREAM
        working-directory: third_party/deepcw-engine
        run: grep -E '^[0-9a-f]{64} ' UPSTREAM | sha256sum -c
      - name: Compare with upstream
        id: compare
        run: |
          f=third_party/deepcw-engine/UPSTREAM
          repo=$(sed -n 's/^repo=//p' "$f")
          pinned=$(sed -n 's/^commit=//p' "$f")
          git clone --quiet --filter=blob:none --no-checkout "https://github.com/$repo" upstream
          cd upstream
          latest=$(git rev-parse HEAD)
          if [ "$latest" = "$pinned" ]; then
            echo "DeepCW is up to date ($repo @ ${pinned:0:7})." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "Upstream [$repo](https://github.com/$repo) has changed since the copy in \`third_party/deepcw-engine\`."
            echo
            echo "Pinned: \`${pinned:0:7}\` · Latest: \`${latest:0:7}\` · [Compare](https://github.com/$repo/compare/$pinned...$latest)"
            echo
            echo "### New commits"
            git log --format='- `%h` %ad %s' --date=short "$pinned..$latest"
            echo
            echo "### Changed files"
            echo '```'
            git diff --stat=100 "$pinned" "$latest"
            echo '```'
            echo
            echo "After updating the model, write the new commit and checksums into \`third_party/deepcw-engine/UPSTREAM\` and close this issue."
          } > ../report.md
          cat ../report.md >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::DeepCW upstream has changed: ${pinned:0:7} -> ${latest:0:7}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open or update issue
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="DeepCW upstream has changed"
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
                --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ -n "$n" ]; then
            gh issue edit "$n" --body-file report.md
          else
            gh issue create --title "$title" --body-file report.md
          fi
