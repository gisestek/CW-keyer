# Builds the Windows zip. A pushed version tag (v0.7.0 or 0.7.0) also publishes a GitHub release
# with the zip attached; the program's update check (FR-CORE-10) looks for exactly that zip.
name: build-windows
on:
  push:
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match cwstation.__version__
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (python -c "import cwstation; print(cwstation.__version__)").Trim()
          $tag = "${{ github.ref_name }}".TrimStart("v", "V")
          if ($tag -ne $v) { throw "Tag $tag does not match cwstation.__version__ $v - installed copies would offer this update forever" }
      - name: Build (tests, PyInstaller, self-test, zip)
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CWStation-win64
          path: dist/CWStation-*-win64.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CWStation-*-win64.zip
          prerelease: ${{ startsWith(github.ref_name, '0.') || startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
          generate_release_notes: true
