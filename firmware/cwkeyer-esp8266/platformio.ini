
; CW keyer – ESP8266 (Wemos D1 mini) firmware
; Käännös:  pio run            Lataus USB:    pio run -t upload
; Sarjamonitori: pio device monitor   Lataus WiFi: pio run -e d1_mini_ota -t upload

[platformio]
src_dir = cwkeyer
default_envs = d1_mini

[env]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
lib_deps =
    links2004/WebSockets @ ^2.6.1
    bblanchon/ArduinoJson @ ^7.2.0
    tzapu/WiFiManager @ ^2.0.17
build_flags =
    -Wall

[env:d1_mini]
upload_speed = 460800

[env:d1_mini_ota]
upload_protocol = espota
upload_port = cwkeyer.local
; Sama salasana kuin OTA_PASSWORD tiedostossa config.h
upload_flags =
    --auth=change-me
